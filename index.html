<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToxGramm - Shaxsiy Makon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kirish oynasi */
        .login-container {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .login-container h2 {
            margin-bottom: 5px;
            color: #38bdf8;
        }

        .login-container p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            outline: none;
            text-align: center;
            font-size: 15px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-container button:hover {
            background: #0369a1;
        }

        /* Asosiy ilova oynasi */
        .app-container {
            display: none;
            width: 90vw;
            height: 85vh;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .sidebar {
            width: 300px;
            background: #0f172a;
            border-right: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h3 {
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 10px;
            background: #1e293b;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e293b;
        }

        .chat-header {
            padding: 15px 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            word-break: break-word;
        }

        .send-box {
            padding: 15px;
            background: #0f172a;
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
        }

        .send-box input {
            flex: 1;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .send-box button {
            padding: 0 20px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Kirish Qismi (Faqat raqam kiritiladi) -->
    <div class="login-container" id="loginCard">
        <div class="logo">💬</div>
        <h2>ToxGramm</h2>
        <p>Shaxsiy yozishmalar va qaydlar</p>
        
        <div class="form-group">
            <input type="text" id="phoneNumber" placeholder="+998 (__) ___-__-__">
        </div>
        <button id="loginBtn">Kirish</button>
    </div>

    <!-- Chat Oynasi -->
    <div class="app-container" id="appContainer">
        <div class="sidebar">
            <h3>ToxGramm</h3>
            <div class="chat-list">
                <div class="chat-item">🔒 Mening Xatcho'plarim</div>
            </div>
        </div>
        <div class="chat-main">
            <div class="chat-header">
                <span id="userPhoneDisplay">Shaxsiy Makon</span>
                <span style="color: #10b981; font-size: 12px;">● Faol</span>
            </div>
            <div class="messages-box" id="messagesBox">
                <div class="message">Xush kelibsiz! ToxGramm muvaffaqiyatli ishga tushdi.</div>
            </div>
            <div class="send-box">
                <input type="text" id="msgInput" placeholder="Xabar yozing..." autocomplete="off">
                <button id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const loginCard = document.getElementById('loginCard');
        const appContainer = document.getElementById('appContainer');
        const loginBtn = document.getElementById('loginBtn');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const userPhoneDisplay = document.getElementById('userPhoneDisplay');
        
        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('msgInput');
        const messagesBox = document.getElementById('messagesBox');

        // Oldindan saqlangan xabarlarni yuklash
        document.addEventListener("DOMContentLoaded", () => {
            const savedMsgs = JSON.parse(localStorage.getItem("tox_messages")) || [];
            savedMsgs.forEach(text => appendMessage(text, false));
        });

        loginBtn.addEventListener('click', () => {
            const phone = phoneNumberInput.value.trim();
            if (!phone) {
                alert("Iltimos, telefon raqamingizni kiriting!");
                return;
            }

            loginCard.style.display = 'none';
            appContainer.style.display = 'flex';
            userPhoneDisplay.textContent = phone;
        });

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            msgInput.value = '';
        }

        function appendMessage(text, save) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.textContent = text;
            messagesBox.appendChild(msgDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;

            if (save) {
                let savedMsgs = JSON.parse(localStorage.getItem("tox_messages")) || [];
                savedMsgs.push(text);
                localStorage.setItem("tox_messages", JSON.stringify(savedMsgs));
            }
        }
    </script>
</body>
</html>
